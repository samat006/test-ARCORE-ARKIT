
services:
  backend:
    image: node:22-alpine
    command: ["node", "/app/server.js"]
    volumes:
      - ./backend/server.js:/app/server.js:ro
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - backend
